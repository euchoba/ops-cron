name: TurboTill Webhook Dispatch

on:
  schedule:
    # Every hour at minute 10 (UTC)
    - cron: '10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: turbotill-webhook-dispatch
      cancel-in-progress: false

    steps:
      - name: Trigger TurboTill webhook processing endpoint
        env:
          CRON_SECRET: ${{ secrets.TURBOTILL_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing required secret: TURBOTILL_CRON_SECRET"
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            -X POST "https://pos.turbotill.app/api/webhooks/process" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"
