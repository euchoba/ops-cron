name: TurboTill Webhook Dispatch

on:
  schedule:
    # Every 5 minutes, to drain the webhook_events queue in small batches
    # (each invocation only processes 5 events to stay under Vercel's 10s
    # Hobby-plan function timeout)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: turbotill-webhook-dispatch
      cancel-in-progress: false

    steps:
      - name: Trigger TurboTill webhook processing endpoint
        env:
          CRON_SECRET: ${{ secrets.TURBOTILL_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing required secret: TURBOTILL_CRON_SECRET"
            exit 1
          fi

          # The cron's only job is to wake the endpoint. Endpoint-side errors
          # (timeouts, 5xx, queue empty, etc.) are handled by TurboTill and
          # should not spam repository owners with failure emails.
          set +e
          http_code=$(curl --silent --show-error \
            -o /tmp/response.txt \
            -w "%{http_code}" \
            -X POST "https://pos.turbotill.app/api/webhooks/process" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")
          set -e

          echo "HTTP status: $http_code"
          if [ -s /tmp/response.txt ]; then
            cat /tmp/response.txt
          fi

          if [ "$http_code" = "401" ]; then
            echo "Unauthorized: check that TURBOTILL_CRON_SECRET matches the CRON_SECRET env var in Vercel"
            exit 1
          fi
